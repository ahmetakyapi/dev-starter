name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # .nvmrc yerel gelistirme surumuyle AYNI major olmali. Farkli npm
      # major'lari ayni package.json'dan farkli kilit uretir: npm 11
      # chromium-bidi'nin devtools-protocol PEER bagimliligi icin tepe seviye
      # girdi yazmaz, npm 10 onu sart kosar. Kilit yerelde gecerli, CI'da
      # gecersiz olur ve her is npm ci'da olur. Bkz. mistakes.md #57
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci'dan ONCE: kilit senkron degilse hata mesaji "Missing: X from
      # lock file" degil, hangi paketin hangi kenari kirik onu soyler.
      # node_modules gerektirmez.
      - name: Verify lockfile integrity
        run: npm run verify:lock

      # --omit=optional KULLANMA: rollup'in platform native binary'si de
      # optionalDependency, onsuz tsup --dts kirilir (mistakes.md #51)
      - name: Install dependencies
        run: npm ci

      # `|| true` YOK. Bu adim eskiden maskeliydi ve eslint bagimliliklari hic
      # kurulu olmadigi icin zaten hicbir zaman calismamisti — CI yesildi,
      # health-check ✅ diyordu, lint diye bir sey yoktu. Bkz. mistakes.md #55
      - name: Lint check
        run: npm run lint -- --max-warnings 0

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build @ahmetakyapi/theme
        run: npm run build --workspace=packages/@ahmet/theme

      - name: Build @ahmetakyapi/ui
        run: npm run build --workspace=packages/@ahmet/ui

      # Artefakti degil, manifest'in VAAT ETTIGI yollari dogrular.
      # Eski hali dist/tokens.js'i kontrol ediyordu — yani package.json'un
      # isaret ettigi dist/index.js'e hic bakmadi ve @ahmetakyapi/theme
      # 5 ay boyunca kirik yayinda kaldi (mistakes.md #48).
      - name: Verify package exports
        run: npm run verify:exports

      # README gorselleri tokens.ts'ten uretiliyor. Token degisip gorsel
      # yeniden uretilmezse README eski paleti gosterirdi; burada kirilir.
      - name: Verify README assets
        run: npm run verify:readme

      # DIKKAT: buradaki adimlar bir zamanlar `! grep ... || echo "temiz"` idiomunu
      # kullaniyordu. O idiom TERS calisir — sizinti VARKEN hem eslesen satiri basar
      # hem "temiz" yazip exit 0 verir. Yani guvenlik taramasi hicbir zaman
      # kirmiziya dusemedi. Acik if/exit disinda bir sey yazma.
      # Bkz. knowledge/mistakes.md #54
      - name: Security scan
        run: |
          echo "--- Checking for hardcoded secrets ---"
          if grep -rnE '(password|secret|api_key|apikey)\s*[:=]\s*["\x27][^"\x27]{8,}' \
            packages/ snippets/ templates/ \
            --include='*.ts' --include='*.tsx' --include='*.js' \
            | grep -v '\.example\|\.template\|\.test\.\|\.spec\.'; then
            echo "❌ Possible hardcoded secret — see matches above"
            exit 1
          fi
          echo "✅ No hardcoded secrets"

          echo "--- Checking for .env files ---"
          if find . -name '.env' -not -name '.env.example' \
            -not -path './node_modules/*' -not -path './.git/*' | grep .; then
            echo "❌ .env file committed — see paths above"
            exit 1
          fi
          echo "✅ No .env files"

      # v3: renk yalnizca token sinifindan. Tema `data-theme` ile dondugu icin
      # `dark:` varyanti da ihlal; eskiden bu satirlar filtreyle eleniyordu.
      - name: Design token violations
        run: |
          echo "--- Checking UI package and snippets for hardcoded colors ---"
          VIOLATIONS=$(grep -rnE '(bg|text|border|ring)-(white|black|gray|slate|zinc|neutral|red|amber|emerald|blue|indigo)(-[0-9]|/)|\bdark:' \
            packages/@ahmet/ui/src/ snippets/ --include='*.ts' --include='*.tsx' 2>/dev/null \
            | grep -v '\.test\.' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Design token violations found:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No design token violations"

      - name: Hook behaviour tests
        run: bash scripts/test-hooks.sh

  agentic:
    name: Agentic Verification
    runs-on: ubuntu-latest

    # Neden ayri is: snippets/agent-* ve templates/agentic-chat/ dosyalari
    # @copilotkit/react-core + @ag-ui/* gerektirir. Bunlar bilincli olarak kok
    # bagimlilik DEGIL (kilidi ve kurulum suresini sisirirler), bu yuzden
    # `npm test` onlari dislar. Buradaki is gecici bir dizinde pin'li kurulum
    # yapip tsc --noEmit + vitest run calistirir.
    #
    # Bu is olmasaydi 25 agentic test yalnizca birinin elle komut yazmasiyla
    # calisirdi — yani pratikte hic. -> knowledge/mistakes.md #55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify agentic snippets and template
        run: npm run verify:agentic

  ecosystem:
    name: Ecosystem Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # health-check kilit dogrulamasini ve hook davranis testini kosar;
      # ikisi de kurulu node_modules ister
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        run: bash scripts/health-check.sh
