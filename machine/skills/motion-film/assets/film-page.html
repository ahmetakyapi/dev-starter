<!doctype html>
<!--
  Film sözleşmesi — başlangıç sayfası.

  Her film bu dört şeyi açar (lemo-opuscar TECHNIQUE § 2'deki sözleşmenin
  sadeleştirilmiş hâli; scripts/film-sheet.mjs ve film-video.mjs bunu okur):

    window.DUR     film süresi (sn)
    window.render  (t) => void — t anının karesini çizer; SAF, sırasız çağrılabilir
    window.READY   fontlar ve görseller hazır olunca true
    window.EV      [{ t, kind, ... }] — ses/işaret olayları (isteğe bağlı)
    window.TEXTS   [{ id, text, from, to, box }] — okuma süresi denetimi (film-read.mjs)
    window.TIMELINE [{ id, start, end }] — sahneler; film-sheet --cuts kesmeleri buradan bulur

  Tarayıcıda açınca oynar. ?t=2.5 o kareye atlar ve durur; boşluk tuşu
  oynat/durdur; ok tuşları 1/24 sn adım. ?audio=mix.wav saati sesten alır:
  hareketin vuruşa oturup oturmadığı ancak sesle birlikte izlenince görülür. Kendi filminde render() gövdesini
  değiştir; TS kitini (assets/film-kit.ts, ink-engine.ts) esbuild ile bundle
  edip <script> olarak ekle:
    npx esbuild film.ts --bundle --format=iife --global-name=Film --outfile=film.js
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film</title>
<style>
  :root { --paper:#f3efe6; --ink:#1d1a17; --accent:#a4720f; }
  @media (prefers-color-scheme: dark) { :root { --paper:#121418; --ink:#ece7dc; --accent:#d3a04a; } }
  html,body { margin:0; height:100%; background:var(--paper); }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="film" aria-hidden="true"></canvas>
<script>
(() => {
  const canvas = document.getElementById("film");
  const ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const pal = { ink: css.getPropertyValue("--ink").trim(), paper: css.getPropertyValue("--paper").trim(), accent: css.getPropertyValue("--accent").trim() };
  const span = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  window.DUR = 4;
  window.EV = [{ t: 0.6, kind: "drop" }, { t: 2.2, kind: "thump" }];
  window.TIMELINE = [{ id: "damla", start: 0, end: 1.8 }, { id: "kelime", start: 1.8, end: 4 }];
  const q = new URLSearchParams(location.search);

  /** Örnek: damla düşer, ezilir, yayılıp bir halka çizer, bir kelime yükselir. Kendi filminle değiştir. */
  window.render = (t) => {
    // Kayıtta tavan yok: film-video --scale=3 tuvali gerçekten 3× çizdirsin; önizlemede 2× yeter.
    const dpr = q.has("capture") ? devicePixelRatio || 1 : Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight;
    // İki boyut da bakılır: yalnız yükseklik değişince (alta yapışık DevTools) bitmap esner, daire elips olur.
    const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    // Damla: düşerken uzar (squash/stretch), değince yayvanlaşır.
    const fall = span(t, 0, 0.6), land = t - 0.6;
    const y = cy - h * 0.4 * (1 - fall * fall);
    const sq = fall < 1 ? 1 + fall * 0.5 : 1 - Math.sin(land * 18) * Math.exp(-land * 7) * 0.4;
    ctx.fillStyle = pal.ink;
    ctx.beginPath(); ctx.ellipse(cx, y, 9 / sq, 9 * sq, 0, 0, Math.PI * 2); ctx.fill();
    // Halka: değişte yayılır.
    const ring = easeInOut(span(t, 0.65, 1.6));
    if (ring > 0) { ctx.strokeStyle = pal.accent; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 70, -Math.PI / 2, -Math.PI / 2 + ring * Math.PI * 2); ctx.stroke(); }
    // Kelime: maskeden yükselir.
    const k = easeOut(span(t, 1.8, 2.5));
    ctx.save(); ctx.beginPath(); ctx.rect(0, cy + 90, w, 80); ctx.clip();
    ctx.font = "800 56px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = pal.ink;
    ctx.fillText("Hazır", cx, cy + 150 + 70 * (1 - k)); ctx.restore();
  };
  /* Yazının kutusu çizimle aynı ifadelerden: ayrı elle yazılmış kutu, yazı
     kayınca yerinde kalır ve denetim yanlış yere bakar. */
  window.TEXTS = [{ id: "hazir", text: "Hazır", from: 1.8, to: 4, box: () => {
    const w = innerWidth, h = innerHeight, half = (ctx.font = "800 56px system-ui, sans-serif", ctx.measureText("Hazır").width / 2);
    return [w / 2 - half, h / 2 + 90, w / 2 + half, h / 2 + 170];
  } }];

  /* renderAt(t): render sözleşmesinin ortak adı (Florence, "Opus 5.5 Motion Lab").
     Tuvali çizer VE sayfadaki CSS/WAAPI animasyonlarını aynı ana dondurur:
     DOM'la yapılmış bir film de kare kare yakalanır. */
  window.renderAt = (t) => {
    window.render(t);
    document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    if (counter) counter.textContent = `${Math.round(t * 24)} · ${t.toFixed(2)} sn`;
  };
  /* ?counter: köşede kare sayacı. Notlar kare numarasıyla yazılsın ("84. karede
     tepe geç"); son kayıttan önce kaldır. */
  const counter = new URLSearchParams(location.search).has("counter")
    ? document.body.appendChild(Object.assign(document.createElement("div"), { style: "position:fixed;right:10px;top:8px;font:600 12px ui-monospace,monospace;opacity:.6" }))
    : null;

  // Önizleme: oynat, ?t= ile atla, boşluk ile durdur.
  let playing = !q.has("t"), t = Number(q.get("t") || 0), last = performance.now();
  /* ?audio=dosya: saat sesin kendisi. audio.currentTime kaba adımlarla ilerler
     (tarayıcıya göre 10–50 ms); iki güncelleme arası performance.now() ile
     doldurulur, yoksa hareket ses saatinin adımında takılır (pdoom-video main.ts). */
  const audio = q.get("audio") ? Object.assign(new Audio(q.get("audio")), { preload: "auto" }) : null;
  let audioT = -1, audioAt = 0;
  // Ses kendiliğinden başlamaz (otomatik oynatma kuralı): ilk boşluk ya da tıklama başlatır.
  if (audio) { playing = false; audio.currentTime = t; }
  const seek = (to) => { t = to; if (audio) audio.currentTime = to; };
  const toggle = () => { playing = !playing; if (audio) playing ? audio.play() : audio.pause(); };
  // Döngü: kareler 0..N−1; N. kare 0. karedir (ikisini birden göstermek ekteki tekleme).
  const loop = (now) => {
    if (playing && audio) {
      if (audio.currentTime !== audioT) { audioT = audio.currentTime; audioAt = now; }
      t = audioT + (audio.paused ? 0 : (now - audioAt) / 1000);
      if (t >= window.DUR) { seek(0); audioT = -1; }
    } else if (playing) { t = (t + (now - last) / 1000) % window.DUR; }
    last = now; window.renderAt(t); requestAnimationFrame(loop);
  };
  addEventListener("keydown", (e) => {
    if (e.key === " ") { toggle(); e.preventDefault(); }
    if (e.key === "ArrowRight") { if (playing) toggle(); seek(Math.min(window.DUR, t + 1 / 24)); }
    if (e.key === "ArrowLeft") { if (playing) toggle(); seek(Math.max(0, t - 1 / 24)); }
  });
  if (audio) addEventListener("pointerdown", toggle);
  // Betikler kendi saatleriyle çizer: önizleme döngüsünü kapatır (?capture).
  if (!q.has("capture")) requestAnimationFrame(loop);
  // Font gelmeden ilk kare çizilmez (yedek font yanlış genişlik verir).
  document.fonts.ready.then(() => { if (q.has("t")) window.renderAt(t); window.READY = true; });
})();
</script>
</body>
</html>
