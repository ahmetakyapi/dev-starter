name: CI

# GITHUB_TOKEN en dar yetkiyle ve checkout sonrasinda diskte tutulmaz:
# npm install sirasinda kosan herhangi bir (ele gecirilmis) bagimlilik
# post-install'u yazma yetkili token bulamasin.
permissions:
  contents: read

# Aksiyon ve runner surumleri sabit (guides/11 § 2): v4'un Node 20 calisma
# zamani kullanimdan kalkti, ubuntu-latest ana surumu sessizce atlar.
# Yukseltme bilincli bir commit olsun.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SIRA BİLİNÇLİ: build önce. `PageProps` ve `RouteContext` global
      # tipleri `.next/types` altında build sırasında üretilir; typecheck
      # önce koşarsa "Cannot find name 'PageProps'" ile düşer.
      # Sırlar CI'da yok: doğrulama atlanır, Auth.js'ye sahte anahtar verilir.
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          AUTH_SECRET: ci-build-placeholder
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
