name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SIRA BİLİNÇLİ: build önce. `PageProps` ve `RouteContext` global
      # tipleri `.next/types` altında build sırasında üretilir; typecheck
      # önce koşarsa "Cannot find name 'PageProps'" ile düşer.
      # Sırlar CI'da yok: doğrulama atlanır, Auth.js'ye sahte anahtar verilir.
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          AUTH_SECRET: ci-build-placeholder
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
