<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500..800&display=swap&subset=latin-ext" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<style>
  /* dev-starter kabuğu. Seçiciler SB 10.6.3 manager/runtime.js'te doğrulandı
     (#storybook-explorer-menu, .sidebar-item[data-nodetype|data-selected]);
     resmi API değil: Storybook yükseltmesinden sonra bu blok gözle
     denetlenir. Palet değişkenleri (--ds-ink, --ds-wash, --ds-tile)
     manager.ts'te tokens.ts'ten üretilip eklenir; aşağıdakiler yedek. */
  :root {
    --ds-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ds-ink: #0c69b1;
    --ds-wash: rgb(13 116 196 / 0.1);
    --ds-tile: linear-gradient(150deg, #5cc4ff 0%, #1f86e0 48%, #0b3f86 100%);
    --ds-muted: #6b6b6b;
    --ds-line: rgb(0 0 0 / 0.08);
  }
  :root[data-theme="dark"] {
    --ds-muted: #8a8a8a;
    --ds-line: rgb(255 255 255 / 0.08);
  }

  /* Marka (brandTitle HTML'i): degrade yalnız karoda, paletle döner. */
  .ds-mark { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ds-mark__tile { width: 28px; height: 28px; border-radius: 8px; flex: none; background: var(--ds-tile);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35); }
  .ds-mark__name { display: block; font: 700 15px/1.1 "Schibsted Grotesk", "Inter", sans-serif; letter-spacing: -0.015em; }
  .ds-mark__meta { display: block; margin-top: 3px; font: 500 11px/1 "JetBrains Mono", monospace; color: var(--ds-muted); }

  /* Üst düzey bölümler: editoryal başlık, aralarında nefes. Büyük harf yok
     (Türkçe İ/ı dönüşümü ve bağıran ton). */
  #storybook-explorer-menu .sidebar-item[data-nodetype="group"]:not([data-parent-id]) { margin-top: 14px; }
  #storybook-explorer-menu .sidebar-item[data-nodetype="group"]:not([data-parent-id]) :is(a, button) {
    font-family: "Schibsted Grotesk", "Inter", sans-serif; font-weight: 650; font-size: 13.5px; letter-spacing: -0.005em;
  }

  /* Ağaç ikonları Storybook'un mor tonunda gelir; paletin mürekkebine çekilir. */
  #storybook-explorer-menu .sidebar-item svg { color: var(--ds-ink); opacity: 0.85; }

  /* Satır: 8 px köşe, marka eğrisiyle hover. */
  #storybook-explorer-menu .sidebar-item { border-radius: 8px; transition: background-color 160ms var(--ds-ease); }

  /* Seçili satır: dolu mavi blok yerine yıkama + mürekkep + 2 px sol çizgi
     (ton farkı ilkesi; Canvas Kit ve Atlassian deseni). Paletle döner. */
  #storybook-explorer-menu .sidebar-item[data-selected="true"],
  #storybook-explorer-menu .sidebar-item[data-selected="true"]:hover { background: var(--ds-wash); color: var(--ds-ink); }
  #storybook-explorer-menu .sidebar-item[data-selected="true"] :is(a, button, svg) { color: var(--ds-ink); }
  #storybook-explorer-menu .sidebar-item[data-selected="true"]::before {
    content: ""; position: absolute; inset-block: 6px; inset-inline-start: 0; width: 2px; border-radius: 2px; background: var(--ds-ink);
  }

  /* "Yeni" hapı (renderLabel). */
  .ds-label { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .ds-new { flex: none; padding: 1px 6px; border-radius: 999px; font: 600 10px/1.5 "Inter", sans-serif;
    color: var(--ds-ink); background: var(--ds-wash); }

  /* Odak: 2 px halka (kimlik kuralı), paletin mürekkebi. */
  #storybook-explorer-menu .sidebar-item :is(a, button):focus-visible { outline: 2px solid var(--ds-ink); outline-offset: -2px; }

  /* Tuval paspartusu: ince çizgi, gölge yok. */
  #storybook-preview-wrapper { border-radius: 10px; }

  @media (prefers-reduced-motion: reduce) { #storybook-explorer-menu .sidebar-item { transition: none; } }
  @media (forced-colors: active) { #storybook-explorer-menu .sidebar-item[data-selected="true"]::before { background: Highlight; } }
</style>
